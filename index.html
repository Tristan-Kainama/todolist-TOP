<head><script defer src="main.js"></script></head><div class="app-container">
    <nav>
        <h1>Projects</h1>
        <div class="projects-container" id="projectsContainer">
            <!-- Projects Goes Here -->
        </div>
        <div class="add-project project-container" id="addProject">
            + Add Project
        </div>
        <div class="add-project-popup" id="addProjectPopup" style="display: none;">
            <h2>New Project</h2>
            <form action="">
                <label for="project-name">Name</label>
                <input type="text" name="project-name" class="project-name-input" id="projectNameInput" placeholder="Project name...">
                <div class="input-buttons">
                    <button id="saveButtonProject">Save</button>
                    <button id="cancelButtonProject">Cancel</button>
                </div>
            </form>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="project-name" id="projectName"></h1>
        <div class="todos-container" id="todosContainer">
            <!-- Todos goes Here -->
        </div>
        <div class="add-todo-button" id="addTodoButton" style="display: none;">
            + Add To-do
        </div>
        <div class="add-todo-popup" id="addTodoPopup" style="display: none;">
            <h2>New To-Do</h2>
            <form action="">
                <label for="todo-title">Title</label>
                <input type="text" name="todo-title" id="toto-title-input" id="todoTitleInput">

                <label for="todo-desc">Description</label>
                <textarea name="todo-desc" rows="4" cols="75" class="todo-desc-input" id="todoDescInput"></textarea>

                <label for="due-date">Due Date</label>
                <input type="date" name="due-date" id="dueDateInput">

                <label for="priority">Priority</label>
                <select name="priority" id="priorityInput">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <div class="input-buttons">
                    <button id="saveButtonTodo">Save</button>
                    <button id="cancelButtonTodo">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
